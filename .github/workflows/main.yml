
name: KreditNazoratPro APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*CloudBuild*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "CloudBuild ZIP topilmadi"
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP_FILE" -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: source
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KreditNazoratPro-APK
          path: source/app/build/outputs/apk/debug/*.apk
